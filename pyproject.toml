[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentrace"
version = "0.1.0"
description = "Evidence-based root-cause analysis framework for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jaydev Patil" }]
keywords = [
    "llm", "observability", "interpretability", "mechanistic-interpretability",
    "root-cause-analysis", "rag", "hallucination",
]

# CPU-first core. NOTHING here requires a GPU. The framework runs and is fully
# tested using these dependencies alone (via the deterministic MockModel backend
# and the synthetic-inference generator) with no model or dataset downloads.
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",   # isotonic/Platt calibration, metrics
    "lightgbm>=4.0",        # gradient-boosted residual heads (CPU-native)
]

[project.optional-dependencies]
# Real model generation (quantized, CPU). llama.cpp Q4 ~2.5GB RAM/model.
generate = ["llama-cpp-python>=0.2.70", "huggingface-hub>=0.23"]
# Grey/white-box mechanistic capture (single HF forward pass on CPU; patching on
# small models). torch+transformers only; nnsight/transformer-lens are optional.
mechanistic = ["torch>=2.2", "transformers>=4.44", "nnsight>=0.3"]
# Retrieval + NLI + embeddings (all small, CPU).
retrieval = ["faiss-cpu>=1.8", "sentence-transformers>=3.0"]
# Prompt-signal helpers.
prompt = ["spacy>=3.7"]
# Interactive developer tool.
app = ["streamlit>=1.36", "plotly>=5.22", "pandas>=2.0"]
# Dataset loaders (RAGTruth, HotpotQA, NQ, TruthfulQA, BEIR).
data = ["datasets>=2.20"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
# Everything.
all = [
    "tokentrace[generate,mechanistic,retrieval,prompt,app,data,dev]",
]

[project.scripts]
tokentrace = "tokentrace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokentrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Focus on genuine errors (pyflakes + pycodestyle). Style/modernization rulesets
# (UP/I/B) are intentionally not enforced to keep the diff focused on correctness.
select = ["E", "F"]
ignore = ["E501", "E731", "E741"]
