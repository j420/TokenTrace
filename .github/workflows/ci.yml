name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `app` is included so the Streamlit tests actually RUN. They importorskip,
      # so installing only [dev] silently skipped all of them -- the demo is one of
      # the project's three deliverables and was effectively untested in CI.
      # Still no GPU and no model downloads: streamlit is a pure-python UI dep.
      - name: Install (CPU core + dev + app — no GPU, no model downloads)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check tokentrace tests scripts
      - name: Test
        run: pytest -q
      # Assert the app tests RAN, not that nothing skipped. The module-level
      # importorskip makes every test in the file skip when streamlit is absent,
      # which is the failure we care about; but the file also contains a legitimate
      # conditional skip, so grepping for the word "skipped" would fail a healthy
      # run. Requiring at least one PASS distinguishes the two.
      - name: Assert the Streamlit tests actually ran
        run: |
          pytest tests/test_app.py -q 2>&1 | tee /tmp/app.log
          grep -qE '[0-9]+ passed' /tmp/app.log || {
            echo "::error::no app test passed — streamlit missing, so the whole file skipped"
            exit 1
          }
